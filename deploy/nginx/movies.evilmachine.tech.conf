map $http_user_agent $movies_is_bot {
    default 0;
    ~*(bot|crawler|spider|slurp|archiver|facebookexternalhit) 1;
}

server {
    server_name movies.evilmachine.tech;

    root /var/www/movies;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /service-worker.js {
        if ($movies_is_bot) { return 403; }
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        try_files $uri =404;
    }

    location ~ "^/[0-9a-f]{40}/" {
        if ($movies_is_bot) { return 403; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        try_files $uri =404;
    }

    location / {
        if ($movies_is_bot) { return 403; }
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/movies.evilmachine.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/movies.evilmachine.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = movies.evilmachine.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name movies.evilmachine.tech;
    return 404; # managed by Certbot
}
